<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KENDALI PTM - Kohort Terkendali pasien Diabetes & Hipertensi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS (Excel Processing) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e0e5ec;
            color: #4a5568;
        }

        /* Neumorphism Styles */
        .neu-flat {
            background: #e0e5ec;
            box-shadow: 9px 9px 16px rgb(163,177,198,0.6), 
                       -9px -9px 16px rgba(255,255,255, 0.5);
        }

        .neu-pressed {
            background: #e0e5ec;
            box-shadow: inset 6px 6px 10px 0 rgba(163, 177, 198, 0.7),
                        inset -6px -6px 10px 0 rgba(255, 255, 255, 0.8);
        }

        .neu-btn {
            background: #e0e5ec;
            box-shadow: 5px 5px 10px rgba(163, 177, 198, 0.6), 
                       -5px -5px 10px rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease-in-out;
        }

        .neu-btn:hover {
            color: #10b981; /* emerald-500 */
        }

        .neu-btn:active, .neu-btn-active {
            box-shadow: inset 4px 4px 8px rgba(163, 177, 198, 0.6), 
                       inset -4px -4px 8px rgba(255, 255, 255, 0.5);
            transform: scale(0.98);
        }

        .drag-active {
            box-shadow: inset 10px 10px 20px rgba(163, 177, 198, 0.8), 
                       inset -10px -10px 20px rgba(255, 255, 255, 0.9);
            border-color: #10b981;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .sticky-col {
            position: sticky;
            left: 0;
            background-color: #e0e5ec;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

    <!-- Login Section -->
    <div id="login-section" class="fixed inset-0 z-50 flex items-center justify-center transition-all duration-700 ease-in-out">
        <div class="w-full max-w-md p-10 rounded-[2rem] neu-flat flex flex-col items-center">
            <div class="w-20 h-20 rounded-full neu-flat flex items-center justify-center mb-6 text-emerald-500">
                <i class="ph ph-shield-check text-4xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-slate-700 mb-2 tracking-tight">Login KENDALI</h2>
            <p class="text-slate-500 mb-8 text-center text-sm">Masukkan username puskesmas Anda untuk mengakses data kohort.</p>
            
            <div class="w-full flex flex-col gap-5">
                <div class="w-full relative">
                    <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl"></i>
                    <input type="text" id="username-input" placeholder="Username..." class="w-full py-4 pl-12 pr-4 rounded-xl neu-pressed outline-none text-slate-700 font-medium placeholder-slate-400 bg-transparent">
                </div>
                
                <button id="login-btn" onclick="handleLogin()" class="w-full py-4 rounded-xl neu-btn font-bold text-slate-600 flex items-center justify-center gap-2">
                    <span id="login-text">Masuk Sekarang</span>
                    <i id="login-icon" class="ph ph-sign-in text-lg"></i>
                </button>
            </div>
            <p id="login-error" class="text-red-500 text-sm font-semibold mt-4 hidden"></p>
        </div>
    </div>

    <!-- Main App Section (Hidden by default) -->
    <div id="app-section" class="opacity-0 translate-y-20 pointer-events-none transition-all duration-700 ease-in-out flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto min-h-screen">
        
        <!-- Navbar / Header -->
        <header class="w-full flex items-center justify-between mb-12 neu-flat p-4 px-8 rounded-2xl">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full neu-pressed flex items-center justify-center">
                    <i class="ph-fill ph-heartbeat text-2xl text-emerald-500"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-700 tracking-tight">KENDALI PTM</h1>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Kohort Terkendali pasien Diabetes & Hipertensi</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center gap-2 px-4 py-2 rounded-lg neu-pressed">
                    <i class="ph ph-user-circle text-emerald-600 text-lg"></i>
                    <span id="user-display-name" class="text-sm font-bold text-slate-600">Guest</span>
                </div>
                <button onclick="handleLogout()" class="w-10 h-10 rounded-full neu-btn flex items-center justify-center text-slate-600 hover:text-red-500" title="Logout">
                    <i class="ph ph-sign-out text-xl"></i>
                </button>
            </div>
        </header>

        <main class="w-full flex flex-col gap-10">
            <!-- Upload Zone -->
            <div class="w-full max-w-2xl mx-auto">
                <div id="drop-zone" class="w-full relative group cursor-pointer p-1 rounded-3xl neu-pressed transition-all duration-300">
                    <input type="file" id="file-upload" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" accept=".xlsx, .xls, .csv">
                    
                    <div class="bg-[#e0e5ec] rounded-[1.4rem] p-12 flex flex-col items-center justify-center text-center transition-all duration-300 relative z-10 pointer-events-none">
                        <div id="upload-icon-container" class="w-20 h-20 rounded-full neu-flat flex items-center justify-center mb-6 text-slate-400 transition-all duration-300">
                            <i id="upload-icon" class="ph ph-cloud-arrow-up text-4xl transition-transform duration-300"></i>
                        </div>
                        
                        <h3 id="upload-text" class="text-xl font-bold text-slate-700 mb-2">Pilih File Excel</h3>
                        
                        <!-- Progress Bar -->
                        <div id="progress-container" class="w-full max-w-xs h-2 neu-pressed rounded-full overflow-hidden mt-4 hidden">
                            <div id="progress-bar" class="h-full bg-emerald-500 w-0 transition-all duration-300 rounded-full"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div id="results-section" class="w-full hidden flex-col opacity-0 transition-opacity duration-700">
                
                <!-- Table 1: DM Terkendali -->
                <div class="w-full flex flex-col gap-4">
                    <div class="flex flex-col md:flex-row items-start md:items-center justify-between w-full gap-4 mb-2 border-b-2 border-[#d5dbe4] pb-4">
                        <div class="flex items-center gap-3">
                            <span class="w-3 h-8 bg-blue-500 rounded-full shadow-[0_0_8px_rgba(59,130,246,0.5)]"></span>
                            <h4 class="text-xl font-extrabold text-slate-700 tracking-tight">DM Terkendali</h4>
                        </div>
                        <div class="flex items-center gap-3 self-end md:self-auto">
                            <button onclick="copyTableData('dm', this)" class="px-5 py-2 neu-btn rounded-xl text-blue-600 font-bold text-sm flex items-center gap-2">
                                <i class="ph ph-copy text-lg"></i> <span>Salin Laporan</span>
                            </button>
                            <a href="https://docs.google.com/spreadsheets/d/1Iz7AeBYLCADXnXtxayB2rOQKsZutc71jqEE4xL0sCxc/edit?gid=447272003#gid=447272003" target="_blank" class="px-5 py-2 neu-btn rounded-xl text-slate-600 hover:text-blue-600 font-bold text-sm flex items-center gap-2">
                                <i class="ph ph-link text-lg"></i> <span>Link Laporan</span>
                            </a>
                        </div>
                    </div>
                    
                    <div class="w-full overflow-x-auto rounded-2xl neu-flat p-2">
                        <table class="w-full text-left border-collapse min-w-max">
                            <thead>
                                <tr id="dm-table-header" class="text-xs uppercase tracking-wider text-slate-500 border-b border-slate-300">
                                    <!-- Dinamis dirender via JS -->
                                </tr>
                            </thead>
                            <tbody id="dm-table-body" class="text-sm font-medium text-slate-600">
                                <!-- Dinamis dirender via JS -->
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination DM -->
                    <div id="dm-pagination" class="flex justify-end gap-3 mt-2 hidden">
                        <button onclick="changePage('DM', -1)" class="px-4 py-2 rounded-lg neu-btn text-slate-600 font-bold text-sm flex items-center gap-2"><i class="ph ph-caret-left"></i> Prev</button>
                        <span id="dm-page-info" class="px-4 py-2 rounded-lg neu-pressed text-slate-500 font-bold text-sm flex items-center">Hal 1</span>
                        <button onclick="changePage('DM', 1)" class="px-4 py-2 rounded-lg neu-btn text-slate-600 font-bold text-sm flex items-center gap-2">Next <i class="ph ph-caret-right"></i></button>
                    </div>
                </div>

                <!-- Divider pemisah antar tabel -->
                <div class="w-full flex justify-center py-10 mt-6 mb-8">
                    <div class="w-3/4 h-1 neu-pressed rounded-full opacity-60"></div>
                </div>

                <!-- Table 2: HT Terkendali -->
                <div class="w-full flex flex-col gap-4">
                    <div class="flex flex-col md:flex-row items-start md:items-center justify-between w-full gap-4 mb-2 border-b-2 border-[#d5dbe4] pb-4">
                        <div class="flex items-center gap-3">
                            <span class="w-3 h-8 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span>
                            <h4 class="text-xl font-extrabold text-slate-700 tracking-tight">HT Terkendali</h4>
                        </div>
                        <div class="flex items-center gap-3 self-end md:self-auto">
                            <button onclick="copyTableData('ht', this)" class="px-5 py-2 neu-btn rounded-xl text-emerald-600 font-bold text-sm flex items-center gap-2">
                                <i class="ph ph-copy text-lg"></i> <span>Salin Laporan</span>
                            </button>
                            <a href="https://docs.google.com/spreadsheets/d/1XrKHboyMs4rAsqXskIi7aw7InaYqiIYOdCUNdk0H6ew/edit?gid=447272003#gid=447272003" target="_blank" class="px-5 py-2 neu-btn rounded-xl text-slate-600 hover:text-emerald-600 font-bold text-sm flex items-center gap-2">
                                <i class="ph ph-link text-lg"></i> <span>Link Laporan</span>
                            </a>
                        </div>
                    </div>
                    
                    <div class="w-full overflow-x-auto rounded-2xl neu-flat p-2">
                        <table class="w-full text-left border-collapse min-w-max">
                            <thead>
                                <tr id="ht-table-header" class="text-xs uppercase tracking-wider text-slate-500 border-b border-slate-300">
                                    <!-- Dinamis dirender via JS -->
                                </tr>
                            </thead>
                            <tbody id="ht-table-body" class="text-sm font-medium text-slate-600">
                                <!-- Dinamis dirender via JS -->
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination HT -->
                    <div id="ht-pagination" class="flex justify-end gap-3 mt-2 hidden">
                        <button onclick="changePage('HT', -1)" class="px-4 py-2 rounded-lg neu-btn text-slate-600 font-bold text-sm flex items-center gap-2"><i class="ph ph-caret-left"></i> Prev</button>
                        <span id="ht-page-info" class="px-4 py-2 rounded-lg neu-pressed text-slate-500 font-bold text-sm flex items-center">Hal 1</span>
                        <button onclick="changePage('HT', 1)" class="px-4 py-2 rounded-lg neu-btn text-slate-600 font-bold text-sm flex items-center gap-2">Next <i class="ph ph-caret-right"></i></button>
                    </div>
                </div>

            </div>
        </main>
        
        <footer class="mt-16 text-center text-slate-400 text-sm font-medium w-full pb-8">
            &copy; <span id="year"></span> KENDALI PTM - Kohort Terkendali pasien Diabetes dan Hipertensi.
        </footer>
    </div>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        // ----------------------------------------------------
        // KONFIGURASI KOLOM
        // ----------------------------------------------------
        // Kategori DM
        const dmColumns = [
            { header: "NIK", index: 2 },
            { header: "Pasien Terdiagnosa", index: 4 },
            { header: "Januari", index: 8 },
            { header: "Februari", index: 15 },
            { header: "Maret", index: 22 },
            { header: "April", index: 29 },
            { header: "Mei", index: 36 },
            { header: "Juni", index: 43 },
            { header: "Juli", index: 50 },
            { header: "Agustus", index: 57 },
            { header: "September", index: 64 },
            { header: "Oktober", index: 71 },
            { header: "November", index: 78 },
            { header: "Desember", index: 85 }
        ];

        // Kategori HT
        const htColumns = [
            { header: "Nama", index: 1 },
            { header: "NIK", index: 2 },
            { header: "Pasien Terdiagnosa", index: 4 },
            { header: "Jan (Sistole)", index: 11 },
            { header: "Jan (Diastole)", index: 12 },
            { header: "Feb (Sistole)", index: 18 },
            { header: "Feb (Diastole)", index: 19 },
            { header: "Mar (Sistole)", index: 25 },
            { header: "Mar (Diastole)", index: 26 },
            { header: "Apr (Sistole)", index: 32 },
            { header: "Apr (Diastole)", index: 33 },
            { header: "Mei (Sistole)", index: 39 },
            { header: "Mei (Diastole)", index: 40 },
            { header: "Jun (Sistole)", index: 46 },
            { header: "Jun (Diastole)", index: 47 },
            { header: "Jul (Sistole)", index: 53 },
            { header: "Jul (Diastole)", index: 54 },
            { header: "Ags (Sistole)", index: 60 },
            { header: "Ags (Diastole)", index: 61 },
            { header: "Sep (Sistole)", index: 67 },
            { header: "Sep (Diastole)", index: 68 },
            { header: "Okt (Sistole)", index: 74 },
            { header: "Okt (Diastole)", index: 75 },
            { header: "Nov (Sistole)", index: 81 },
            { header: "Nov (Diastole)", index: 82 },
            { header: "Des (Sistole)", index: 88 },
            { header: "Des (Diastole)", index: 89 }
        ];

        // ----------------------------------------------------
        // LOGIKA LOGIN & LOGOUT
        // ----------------------------------------------------
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxYBzzCKleeNvO8gCAcSMi37sQ4n4oe8Lg3e6E45NZdqkXWHlaItx8bjaKYs0pUoPLr/exec'; 
        const loginSection = document.getElementById('login-section');
        const appSection = document.getElementById('app-section');
        const usernameInput = document.getElementById('username-input');

        // Cek sesi saat dimuat
        window.onload = function() {
            const savedUser = sessionStorage.getItem('username');
            if (savedUser) {
                showAppScreen(savedUser);
            }
        };

        // Event listener untuk tekan Enter pada input login
        usernameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // Mencegah form submit bawaan
                handleLogin();      // Jalankan fungsi klik tombol masuk
            }
        });

        function showAppScreen(username) {
            document.getElementById('user-display-name').innerText = username;
            
            // Animasi Hide Login
            loginSection.classList.add('scale-95', 'opacity-0', 'pointer-events-none');
            
            // Animasi Show App
            setTimeout(() => {
                loginSection.classList.add('hidden');
                appSection.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none');
            }, 500);
        }

        async function handleLogin() {
            const username = usernameInput.value.trim();
            const errorText = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');
            const loginText = document.getElementById('login-text');
            const loginIcon = document.getElementById('login-icon');

            if (!username) {
                errorText.innerText = "Username tidak boleh kosong!";
                errorText.classList.remove('hidden');
                return;
            }

            errorText.classList.add('hidden');
            
            // Efek Loading Tombol
            loginText.innerText = "Memeriksa...";
            loginIcon.classList.replace('ph-sign-in', 'ph-spinner');
            loginIcon.classList.add('animate-spin');
            loginBtn.classList.add('neu-btn-active');

            // Bypass khusus testing admin
            if (username.toLowerCase() === 'admin') {
                setTimeout(() => {
                    sessionStorage.setItem('username', 'admin');
                    showAppScreen('admin');
                    resetLoginBtn();
                }, 800);
                return;
            }

            // Panggil API Google Script
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?username=${encodeURIComponent(username)}`);
                const result = await response.json();

                if (result.status === 'success') {
                    sessionStorage.setItem('username', username);
                    showAppScreen(username);
                } else {
                    errorText.innerText = result.message;
                    errorText.classList.remove('hidden');
                }
            } catch (error) {
                errorText.innerText = "Terjadi kesalahan koneksi ke server.";
                errorText.classList.remove('hidden');
            } finally {
                resetLoginBtn();
            }
        }

        function resetLoginBtn() {
            const loginBtn = document.getElementById('login-btn');
            const loginText = document.getElementById('login-text');
            const loginIcon = document.getElementById('login-icon');
            
            loginText.innerText = "Masuk Sekarang";
            loginIcon.classList.replace('ph-spinner', 'ph-sign-in');
            loginIcon.classList.remove('animate-spin');
            loginBtn.classList.remove('neu-btn-active');
        }

        function handleLogout() {
            sessionStorage.removeItem('username');
            
            // Animasi Hide App
            appSection.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
            
            // Reset Data & UI
            setTimeout(() => {
                resetAppData();
                loginSection.classList.remove('hidden');
                
                // Animasi Show Login (Delay agar rapi)
                setTimeout(() => {
                    loginSection.classList.remove('scale-95', 'opacity-0', 'pointer-events-none');
                    usernameInput.value = '';
                }, 50);
            }, 700);
        }

        function resetAppData() {
            globalProcessedData = {
                DM: { rows: [], columns: dmColumns },
                HT: { rows: [], columns: htColumns }
            };
            currentPage = { DM: 1, HT: 1 };
            document.getElementById('results-section').classList.add('hidden', 'opacity-0');
            document.getElementById('upload-text').innerText = 'Pilih File Excel';
            
            const pBar = document.getElementById('progress-bar');
            pBar.style.width = '0%';
            document.getElementById('progress-container').classList.add('hidden');
        }

        function showNotification(msg, type='success') {
            const notif = document.createElement('div');
            const color = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
            notif.className = `fixed bottom-8 right-8 px-6 py-4 rounded-xl shadow-[0_10px_20px_rgba(0,0,0,0.15)] text-white font-bold transition-all duration-500 transform translate-y-10 opacity-0 z-50 flex items-center gap-3 ${color}`;
            
            const icon = type === 'success' ? '<i class="ph ph-check-circle text-2xl"></i>' : '<i class="ph ph-warning-circle text-2xl"></i>';
            notif.innerHTML = `${icon} <span>${msg}</span>`;
            
            document.body.appendChild(notif);
            
            // Animate In
            setTimeout(() => {
                notif.classList.remove('translate-y-10', 'opacity-0');
            }, 100);

            // Animate Out
            setTimeout(() => {
                notif.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => notif.remove(), 500);
            }, 3000);
        }

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-upload');
        const resultsSection = document.getElementById('results-section');
        
        // Data Global dan Pagination
        let globalProcessedData = {
            DM: { rows: [], columns: dmColumns },
            HT: { rows: [], columns: htColumns }
        };
        const rowsPerPage = 5;
        let currentPage = { DM: 1, HT: 1 };

        // Events Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.add('drag-active');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.remove('drag-active');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) processFile(files[0]);
        });

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        });

        function processFile(file) {
            const currentUser = sessionStorage.getItem('username');
            
            const uploadText = document.getElementById('upload-text');
            const uploadIcon = document.getElementById('upload-icon');
            const uploadIconContainer = document.getElementById('upload-icon-container');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            
            // Animasi Loading Biru
            uploadText.innerText = 'Membaca data...';
            uploadText.classList.remove('text-red-500', 'text-emerald-500');
            uploadIcon.classList.replace('ph-cloud-arrow-up', 'ph-spinner');
            uploadIcon.classList.add('animate-spin');
            
            uploadIconContainer.classList.remove('text-slate-400', 'text-red-500', 'text-emerald-500');
            uploadIconContainer.classList.add('text-blue-500');
            
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '30%';

            const reader = new FileReader();
            
            reader.onload = function(e) {
                progressBar.style.width = '60%';
                
                setTimeout(() => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheetName = workbook.SheetNames[0];
                    const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
                    
                    // Keamanan A2
                    if (currentUser !== 'admin') {
                        const a2Value = String(sheet[1] && sheet[1][0] ? sheet[1][0] : '').toLowerCase();
                        if (!a2Value.includes(currentUser.toLowerCase())) {
                            uploadText.innerText = 'Akses Ditolak!';
                            uploadText.classList.add('text-red-500');
                            
                            uploadIcon.classList.replace('ph-spinner', 'ph-warning');
                            uploadIcon.classList.remove('animate-spin');
                            uploadIconContainer.classList.remove('text-blue-500');
                            uploadIconContainer.classList.add('text-red-500');
                            
                            progressBar.classList.replace('bg-emerald-500', 'bg-red-500');
                            progressBar.style.width = '100%';
                            
                            showNotification('File ini bukan milik puskesmas Anda.', 'error');
                            return;
                        }
                    }

                    // Reset styling success
                    uploadText.classList.remove('text-red-500');
                    uploadIconContainer.classList.remove('text-red-500', 'text-blue-500');
                    uploadIconContainer.classList.add('text-emerald-500');
                    progressBar.classList.remove('bg-red-500');
                    progressBar.classList.add('bg-emerald-500');

                    // Filter Logic (Baris 10 dst, Kolom H=7)
                    const startIndex = 9;
                    const colHIndex = 7;
                    
                    const dmData = [];
                    const htData = [];
                    
                    for (let i = startIndex; i < sheet.length; i++) {
                        const row = sheet[i];
                        if (row && row[colHIndex]) {
                            const indicator = String(row[colHIndex]).toUpperCase();
                            if (indicator.includes('DM')) dmData.push(row);
                            if (indicator.includes('HT')) htData.push(row);
                        }
                    }
                    
                    globalProcessedData.DM.rows = dmData;
                    globalProcessedData.HT.rows = htData;
                    currentPage.DM = 1;
                    currentPage.HT = 1;
                    
                    progressBar.style.width = '100%';
                    uploadText.innerText = 'Selesai!';
                    uploadText.classList.add('text-emerald-500');
                    uploadIcon.classList.replace('ph-spinner', 'ph-check-circle');
                    uploadIcon.classList.remove('animate-spin');
                    
                    setTimeout(() => {
                        resultsSection.classList.remove('hidden');
                        setTimeout(() => resultsSection.classList.remove('opacity-0'), 50);
                        
                        renderTable('DM');
                        renderTable('HT');

                        // Reset progress UI setelah beberapa saat (kembali ke abu-abu)
                        setTimeout(() => {
                            uploadText.innerText = 'Pilih File Excel Lain';
                            uploadText.classList.remove('text-emerald-500');
                            uploadIcon.classList.replace('ph-check-circle', 'ph-cloud-arrow-up');
                            uploadIconContainer.classList.remove('text-emerald-500');
                            uploadIconContainer.classList.add('text-slate-400');
                            
                            progressContainer.classList.add('hidden');
                            progressBar.style.width = '0%';
                        }, 2000);
                    }, 500);

                }, 500); // Artificial delay animasi
            };
            
            reader.readAsArrayBuffer(file);
        }

        function renderTable(type) {
            const dataObj = globalProcessedData[type];
            const thead = document.getElementById(`${type.toLowerCase()}-table-header`);
            const tbody = document.getElementById(`${type.toLowerCase()}-table-body`);
            const pagination = document.getElementById(`${type.toLowerCase()}-pagination`);
            const pageInfo = document.getElementById(`${type.toLowerCase()}-page-info`);
            
            // Header
            thead.innerHTML = "";
            dataObj.columns.forEach((col, idx) => {
                let thClass = "py-4 px-5 text-left border-b border-slate-300";
                if (idx === 0) thClass += " sticky-col border-r border-slate-200/50 shadow-[2px_0_5px_rgba(0,0,0,0.03)] rounded-tl-xl";
                
                const th = document.createElement('th');
                th.className = thClass;
                th.innerText = col.header;
                thead.appendChild(th);
            });

            // Body
            tbody.innerHTML = "";
            if (dataObj.rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${dataObj.columns.length}" class="py-12 text-center text-slate-400 font-medium italic"><div class="inline-block px-6 py-3 rounded-2xl neu-pressed">Tidak ada data ditemukan untuk kriteria ini.</div></td></tr>`;
                if(pagination) pagination.classList.add('hidden');
                return;
            }

            // Pagination calculation
            const totalPages = Math.ceil(dataObj.rows.length / rowsPerPage);
            const startIdx = (currentPage[type] - 1) * rowsPerPage;
            const endIdx = startIdx + rowsPerPage;
            const paginatedRows = dataObj.rows.slice(startIdx, endIdx);

            paginatedRows.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-300/20 transition-colors border-b border-slate-200/60 last:border-0";
                
                dataObj.columns.forEach((col, colIndex) => {
                    let tdClass = "py-3 px-5 whitespace-nowrap";
                    let cellValue = row[col.index];
                    
                    if (cellValue === undefined || cellValue === null || cellValue === "") cellValue = "-";
                    
                    if (type === 'DM' && colIndex > 1) { // Hapus mg/dL pada bulan DM
                        if (typeof cellValue === 'string') {
                            cellValue = cellValue.replace(/mg\/dl/i, '').trim();
                        }
                    }

                    if (colIndex === 0) {
                        tdClass += " sticky-col border-r border-slate-200/50 shadow-[2px_0_5px_rgba(0,0,0,0.03)] font-bold text-slate-700";
                    }

                    const td = document.createElement('td');
                    td.className = tdClass;
                    td.innerText = cellValue;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            // Update Pagination UI
            if (totalPages > 1) {
                if(pagination) pagination.classList.remove('hidden');
                if(pageInfo) pageInfo.innerText = `Hal ${currentPage[type]} dari ${totalPages}`;
            } else {
                if(pagination) pagination.classList.add('hidden');
            }
        }

        function changePage(type, direction) {
            const dataObj = globalProcessedData[type];
            const totalPages = Math.ceil(dataObj.rows.length / rowsPerPage);
            
            currentPage[type] += direction;
            if (currentPage[type] < 1) currentPage[type] = 1;
            if (currentPage[type] > totalPages) currentPage[type] = totalPages;
            
            renderTable(type);
        }

        function copyTableData(type, btnElement) {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = `<i class="ph ph-check text-lg"></i> <span>Tersalin!</span>`;
            
            setTimeout(() => {
                btnElement.innerHTML = originalText;
            }, 2000);

            const dataObj = globalProcessedData[type.toUpperCase()];
            if (!dataObj || dataObj.rows.length === 0) {
                showNotification('Tidak ada data untuk disalin', 'error');
                return;
            }

            let tsvContent = "";
            
            // Menyalin KESELURUHAN baris (bukan cuma halaman saat ini)
            dataObj.rows.forEach(row => {
                let rowString = "";
                dataObj.columns.forEach((col, index) => {
                    let cellValue = row[col.index];
                    if (cellValue === undefined || cellValue === null || cellValue === "") cellValue = "-";
                    
                    // Bersihkan tulisan mg/dL untuk DM
                    if (type === 'dm' && index > 1) {
                        if (typeof cellValue === 'string') {
                            cellValue = cellValue.replace(/mg\/dl/i, '').trim();
                        }
                    }
                    
                    rowString += cellValue;

                    // Sisipkan 2 kolom Tab kosong setelah "Pasien Terdiagnosa"
                    if (type === 'dm' && index === 1) {
                        rowString += "\t\t";
                    } else if (type === 'ht' && index === 2) {
                        rowString += "\t\t";
                    }

                    if (index < dataObj.columns.length - 1) {
                        rowString += "\t";
                    }
                });
                tsvContent += rowString + "\n";
            });

            // Eksekusi copy manual menggunakan textarea
            const textarea = document.createElement("textarea");
            textarea.value = tsvContent;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand("copy");
                showNotification(`Data ${type.toUpperCase()} (tanpa header) berhasil disalin!`);
            } catch (err) {
                showNotification('Gagal menyalin. Browser tidak mendukung.', 'error');
            }
            document.body.removeChild(textarea);
        }
    </script>
</body>
